<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale= 1, width=device-width" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Adriano Interaminense" />
    <title>Adriano Interaminense</title>

    <!--
      Keep the boot skeleton hidden until the app stylesheet applies (it sets
      #boot back to visible). In production that stylesheet is in <head>, so
      nothing changes; in dev, Vite injects CSS from JS, and without this the
      unstyled skeleton flashes a giant theme-switch icon.
    -->
    <style>
      #boot {
        visibility: hidden;
      }
    </style>

    <!-- Open connections early so fonts, sign-in and data don't wait on the bundle. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" />
    <link rel="preconnect" href="https://home-page-877ff.firebaseio.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&display=swap"
    />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <!--
        Static copy of PageSkeleton, painted before the JS bundle downloads.
        React replaces it on first render with the same markup, so there's no
        jump. Keep it in sync with src/components/skeleton/PageSkeleton.tsx.
      -->
      <div id="boot" class="theme--light">
        <div class="layout">
          <header class="layout__header">
            <div>
              <div class="logo">
                <div class="logo__image">
                  <span class="skeleton skeleton--circle"></span>
                </div>
                <span class="skeleton" style="width: 11em; height: 0.9em"></span>
              </div>
            </div>
            <div class="layout--d-flex">
              <div id="boot-theme-switch" class="theme-switch theme-switch--light"><div class="theme-switch__auto-mode"><div class="theme-switch__text">auto</div></div><div class="theme-switch__manual-mode"><div class="theme-switch__text theme-switch__text--dark">dark</div><div class="theme-switch__toggle"><div class="theme-switch__toggle-item"><div class="theme-switch__toggle-item__dark"><svg aria-hidden="true" focusable="false" data-prefix="fas" data-icon="moon" class="svg-inline--fa fa-moon " role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512"><path fill="currentColor" d="M223.5 32C100 32 0 132.3 0 256S100 480 223.5 480c60.6 0 115.5-24.2 155.8-63.4c5-4.9 6.3-12.5 3.1-18.7s-10.1-9.7-17-8.5c-9.8 1.7-19.8 2.6-30.1 2.6c-96.9 0-175.5-78.8-175.5-176c0-65.8 36-123.1 89.3-153.3c6.1-3.5 9.2-10.5 7.7-17.3s-7.3-11.9-14.3-12.5c-6.3-.5-12.6-.8-19-.8z"></path></svg></div><div class="theme-switch__toggle-item__light"><svg aria-hidden="true" focusable="false" data-prefix="fas" data-icon="sun" class="svg-inline--fa fa-sun " role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><path fill="currentColor" d="M361.5 1.2c5 2.1 8.6 6.6 9.6 11.9L391 121l107.9 19.8c5.3 1 9.8 4.6 11.9 9.6s1.5 10.7-1.6 15.2L446.9 256l62.3 90.3c3.1 4.5 3.7 10.2 1.6 15.2s-6.6 8.6-11.9 9.6L391 391 371.1 498.9c-1 5.3-4.6 9.8-9.6 11.9s-10.7 1.5-15.2-1.6L256 446.9l-90.3 62.3c-4.5 3.1-10.2 3.7-15.2 1.6s-8.6-6.6-9.6-11.9L121 391 13.1 371.1c-5.3-1-9.8-4.6-11.9-9.6s-1.5-10.7 1.6-15.2L65.1 256 2.8 165.7c-3.1-4.5-3.7-10.2-1.6-15.2s6.6-8.6 11.9-9.6L121 121 140.9 13.1c1-5.3 4.6-9.8 9.6-11.9s10.7-1.5 15.2 1.6L256 65.1 346.3 2.8c4.5-3.1 10.2-3.7 15.2-1.6zM160 256a96 96 0 1 1 192 0 96 96 0 1 1 -192 0zm224 0a128 128 0 1 0 -256 0 128 128 0 1 0 256 0z"></path></svg></div></div></div><div class="theme-switch__text theme-switch__text--light">light</div></div></div>
              <ul class="social-network">
                <li><span class="skeleton skeleton--circle skeleton--inline" style="width: 1em; height: 1em"></span></li>
                <li><span class="skeleton skeleton--circle skeleton--inline" style="width: 1em; height: 1em"></span></li>
                <li><span class="skeleton skeleton--circle skeleton--inline" style="width: 1em; height: 1em"></span></li>
                <li><span class="skeleton skeleton--circle skeleton--inline" style="width: 1em; height: 1em"></span></li>
              </ul>
            </div>
          </header>
          <div class="layout__body layout__body--wide">
            <div id="boot-presentation" class="layout__presentation">
              <section class="hero">
                <div class="hero__text">
                  <div class="hero__name">
                    <span class="skeleton hero__name-line" style="width: 70%"></span>
                    <span class="skeleton hero__name-line" style="width: 95%"></span>
                  </div>
                  <div class="hero__intro">
                    <div class="skeleton-text">
                      <span class="skeleton skeleton-text__line"></span>
                      <span class="skeleton skeleton-text__line"></span>
                      <span class="skeleton skeleton-text__line"></span>
                    </div>
                  </div>
                  <div class="hero__meta">
                    <div class="reactions">
                      <span class="skeleton skeleton--pill skeleton--inline" style="width: 52px; height: 18px; margin-right: 1.25rem"></span>
                      <span class="skeleton skeleton--pill skeleton--inline" style="width: 52px; height: 18px; margin-right: 1.25rem"></span>
                      <span class="skeleton skeleton--pill skeleton--inline" style="width: 52px; height: 18px; margin-right: 1.25rem"></span>
                      <span class="skeleton skeleton--pill skeleton--inline" style="width: 52px; height: 18px; margin-right: 1.25rem"></span>
                      <span class="skeleton skeleton--pill skeleton--inline" style="width: 52px; height: 18px; margin-right: 1.25rem"></span>
                    </div>
                  </div>
                </div>
                <div class="hero__portrait">
                  <div class="dot-portrait" aria-hidden="true"></div>
                </div>
              </section>
            </div>
          </div>
        </div>
      </div>
      <script>
        (function () {
          var match = document.cookie.match(/interaminense_website_theme="?(\w+)/);
          var theme = match ? match[1] : "light";
          var route = location.hash.replace(/^#\/?/, "");
          document.getElementById("boot").className = "theme--" + theme;
          document.getElementById("boot-theme-switch").className =
            "theme-switch theme-switch--" + theme;
          // Only the home page opens with the presentation block.
          if (route && route !== "home") {
            document.getElementById("boot-presentation").remove();
          }
        })();
      </script>
    </div>
    <script type="module" src="/src/index.tsx"></script>

    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-BJDPM557R4"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-BJDPM557R4");
    </script>
  </body>
</html>
